<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Kendali Jadwal Proyek</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: aplikasi satu layar — bilah atas + tab (Jadwal | Progres | Dashboard); Gantt dua panel tersinkron */
:root{
  --bg:#F2F4F3; --panel:#FFFFFF; --ink:#18211F; --muted:#5D6A66; --faint:#8A9692; --line:#D9E0DD; --line2:#ECF0EE; --row-alt:#F8FAF9;
  --accent:#0D6B5F; --accent-ink:#FFFFFF; --accent-soft:#DCEDE9;
  --bar:#3E7FA5; --bar-prog:#1C4C68; --crit:#C0402C; --crit-prog:#842816; --base:#B3BCB9; --sum:#26302D; --plan:#7A8783;
  --good:#2C8550; --good-soft:#DDF0E3; --warn:#B57E0E; --warn-soft:#F7EBCB; --bad:#C0402C; --bad-soft:#F7DDD8; --today:#D97A22; --nonwork:#EEF1F0;
  --f-display:'Archivo','Arial Narrow',system-ui,sans-serif; --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r:6px; --rh:30px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1514; --panel:#161E1D; --ink:#E3EAE7; --muted:#97A5A0; --faint:#6E7C78; --line:#2A3533; --line2:#1E2826; --row-alt:#131A19;
  --accent:#3DB4A1; --accent-ink:#06201C; --accent-soft:#163833;
  --bar:#4E8DB4; --bar-prog:#A4D0EA; --crit:#E0644E; --crit-prog:#F6B2A5; --base:#4E5B58; --sum:#D6DFDC; --plan:#8E9C98;
  --good:#4DBA78; --good-soft:#173826; --warn:#E0A93A; --warn-soft:#3A2F14; --bad:#E86A55; --bad-soft:#3E1D18; --today:#F0963F; --nonwork:#121918;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1514; --panel:#161E1D; --ink:#E3EAE7; --muted:#97A5A0; --faint:#6E7C78; --line:#2A3533; --line2:#1E2826; --row-alt:#131A19;
  --accent:#3DB4A1; --accent-ink:#06201C; --accent-soft:#163833;
  --bar:#4E8DB4; --bar-prog:#A4D0EA; --crit:#E0644E; --crit-prog:#F6B2A5; --base:#4E5B58; --sum:#D6DFDC; --plan:#8E9C98;
  --good:#4DBA78; --good-soft:#173826; --warn:#E0A93A; --warn-soft:#3A2F14; --bad:#E86A55; --bad-soft:#3E1D18; --today:#F0963F; --nonwork:#121918;
  color-scheme:dark }
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:13.5px;line-height:1.45;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* Bilah atas */
.top{background:var(--panel);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;flex:none}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 220px}
.brand small{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand h1{margin:0;font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:19px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;background:var(--line2);padding:3px;border-radius:8px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.save{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.save i{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.save.busy i{background:var(--warn)} .save.err i{background:var(--bad)} .save.local i{background:var(--faint)}

.btn{border:1px solid var(--line);background:var(--panel);padding:6px 11px;border-radius:var(--r);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:500;font-size:13px}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--line2)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 10px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}

.banner{flex:none;background:var(--warn-soft);color:var(--ink);padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.banner b{font-weight:600}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.view.scroll{overflow:auto;display:block}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;max-width:1320px;margin:0 auto}

/* Toolbar Gantt */
.tb{flex:none;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.tb .sep{width:1px;height:22px;background:var(--line)}
.legend{display:flex;gap:12px;align-items:center;font-size:11.5px;color:var(--muted);margin-left:auto;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:18px;height:8px;border-radius:2px}

/* Gantt */
.gantt{flex:1;min-height:0;display:grid;grid-template-columns:var(--lw,600px) 5px minmax(0,1fr);grid-template-rows:minmax(0,1fr);background:var(--panel)}
.gantt>*{min-height:0}
.gr{scrollbar-width:auto;scrollbar-color:var(--faint) var(--line2)}
.gr::-webkit-scrollbar{width:12px;height:12px}
.gr::-webkit-scrollbar-track{background:var(--line2)}
.gr::-webkit-scrollbar-thumb{background:var(--faint);border-radius:6px;border:3px solid var(--line2)}
.gr::-webkit-scrollbar-thumb:hover{background:var(--muted)}
.gl{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
.split{cursor:col-resize;background:var(--line2)} .split:hover{background:var(--accent-soft)}
.gh{height:48px;flex:none;border-bottom:1px solid var(--line);background:var(--panel)}
.glb{flex:1;overflow-y:auto;overflow-x:auto;scrollbar-width:none}
.glb::-webkit-scrollbar{display:none}
.r{display:grid;grid-template-columns:var(--cols);height:var(--rh);align-items:center;border-bottom:1px solid var(--line2);cursor:pointer}
.r>div{padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.r .c-n{font-family:var(--f-mono);font-size:11.5px;color:var(--faint);text-align:right}
.r .c-w{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.r .c-d,.r .c-s,.r .c-f,.r .c-p,.r .c-pc,.r .c-b,.r .c-v{font-family:var(--f-mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.r .c-pc,.r .c-b,.r .c-v{text-align:right}
.r .c-u{font-size:12px;color:var(--muted)}
.gl>.gh{overflow:hidden}
.gl .r{min-width:754px}
.r.sum{font-weight:600} .r.sum .c-name{font-family:var(--f-display);font-stretch:90%;font-size:13px;letter-spacing:.01em}
.r.sel{background:var(--accent-soft)} .r:hover:not(.sel){background:var(--row-alt)}
.r.crit .c-name{color:var(--crit)}
.r.head{height:48px;cursor:default;border-bottom:0;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;background:transparent}
.r.head>div{font-size:10.5px;font-family:var(--f-body)}
.c-name{display:flex;align-items:center;gap:4px}
.car{width:16px;height:16px;border:0;background:none;padding:0;cursor:pointer;color:var(--muted);flex:none;display:inline-grid;place-items:center}
.car svg{width:12px;height:12px;transition:transform .15s}
.car.closed svg{transform:rotate(-90deg)}
.gr{overflow:auto;position:relative;min-width:0}
.gr .gh{position:sticky;top:0;z-index:3}
.gr svg{display:block}
#gsvg{cursor:grab;touch-action:pan-x pan-y} #gsvg .bar{cursor:grab} #gsvg .bar.drag{cursor:grabbing;opacity:.8}
#gsvg text{font-family:var(--f-body)}
.ro #gsvg .bar{cursor:pointer}

/* Laci edit */
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(360px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.08);z-index:20;display:flex;flex-direction:column}
.drawer header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.drawer header h3{margin:0;font-family:var(--f-display);font-stretch:90%;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer .body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.drawer footer{border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label,.lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fld input,.fld select,.fld textarea,.inp{border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:6px 8px;width:100%;min-width:0}
.fld input:focus,.inp:focus{border-color:var(--accent);outline:none;background:var(--panel)}
.fld .hint{font-size:11.5px;color:var(--faint)}
.fld .err{font-size:11.5px;color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono);font-size:12px}
.boxed{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--row-alt)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--line2);color:var(--muted);white-space:nowrap}
.chip.crit{background:var(--bad-soft);color:var(--bad)}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}

/* Kartu umum */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.card>.hd{padding:12px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card>.hd h2{margin:0;font-family:var(--f-display);font-stretch:88%;font-weight:700;font-size:16px;letter-spacing:.005em;text-wrap:balance}
.card>.hd .sub{color:var(--muted);font-size:12.5px}
.card>.bd{padding:14px 16px}
.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t td.n,table.t th.n{text-align:right}
table.t tr.grp td{background:var(--row-alt);font-weight:600;font-size:12px;color:var(--muted)}
.pbar{height:6px;background:var(--line2);border-radius:3px;position:relative;min-width:70px;overflow:hidden}
.pbar>i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
.pbar>b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}

/* Progres */
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.pform{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.pform .fld{flex:0 1 auto}
.pform .fld.grow{flex:1 1 260px}
.qin{width:96px;text-align:right;font-family:var(--f-mono)}
.uin{width:62px} .tin{width:84px;text-align:right;font-family:var(--f-mono)} .nin{width:150px}
.hist{max-height:620px;overflow:auto}
.hi{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:9px 16px;border-bottom:1px solid var(--line2);align-items:start}
.hi .d{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);padding-top:1px}
.hi .w{font-size:12.5px;min-width:0}
.hi .w small{display:block;color:var(--faint);font-size:11.5px}
.hi .q{font-family:var(--f-mono);font-size:12.5px;text-align:right;white-space:nowrap}
.hi .x{grid-column:3;justify-self:end}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty h3{font-family:var(--f-display);font-stretch:90%;color:var(--ink);margin:0 0 6px;font-size:18px}

/* Dashboard */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.kpi .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-stretch:80%;font-weight:700;font-size:30px;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.good .v{color:var(--good)} .kpi.warn .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)}
.dgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.chart text{font-family:var(--f-mono);font-size:10.5px;fill:var(--muted)}
.dhead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px}
.dhead h2{margin:0;font-family:var(--f-display);font-stretch:85%;font-size:24px;font-weight:700;flex:1 1 260px;text-wrap:balance}
.dhead h2 small{display:block;font-family:var(--f-body);font-size:12.5px;color:var(--muted);font-weight:400;font-stretch:100%}
.evm{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.evm div{border-top:2px solid var(--line);padding-top:6px}
.evm b{display:block;font-family:var(--f-mono);font-size:14px;font-weight:500}
.evm span{font-size:11.5px;color:var(--muted)}

/* Modal */
.mb{position:fixed;inset:0;background:rgba(10,16,15,.45);z-index:50;display:grid;place-items:center;padding:16px}
.md{background:var(--panel);border-radius:12px;width:min(520px,100%);max-height:90%;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.md header{padding:16px 18px 6px} .md header h3{margin:0;font-family:var(--f-display);font-stretch:88%;font-size:19px}
.md .body{padding:8px 18px 4px;display:flex;flex-direction:column;gap:12px}
.md footer{padding:14px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:24px;text-align:center;color:var(--muted);cursor:pointer}
.drop.on{border-color:var(--accent);background:var(--accent-soft)}
.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;width:max-content;max-width:calc(100% - 32px);pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.load{display:grid;place-items:center;height:100%;color:var(--muted)}
.wdays{display:flex;gap:4px;flex-wrap:wrap}
.wdays label{border:1px solid var(--line);border-radius:5px;padding:4px 8px;font-size:12.5px;display:flex;gap:4px;align-items:center;cursor:pointer}

.ro .edit-only{display:none!important}
body:not(.role-admin) .admin-only{display:none!important}
#asWrap[hidden]{display:none!important}
body.role-pel .save span{display:inline}
body.role-guest .save,body.role-pending .save{display:none}
.banner.info{background:var(--accent-soft)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;font-weight:600;margin-left:4px}
.gpick{border:1px solid var(--line);border-radius:6px;max-height:240px;overflow:auto;padding:4px 0}
.gpick label{display:flex;gap:8px;align-items:center;padding:5px 8px;font-size:13px;cursor:pointer}
.gpick label:hover{background:var(--row-alt)}
.treq{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line2)}
.tres{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.12);z-index:10;overflow:hidden}
.tres button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:8px 12px;cursor:pointer;text-align:left}
.tres button:hover,.tres button:focus-visible{background:var(--row-alt)}
.tres img{width:24px;height:24px;border-radius:50%;flex:none}
.tres span:first-of-type{flex:1;min-width:0}
@media (max-width:1000px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .dgrid,.pgrid{grid-template-columns:minmax(0,1fr)} }
@media (max-width:720px){
  .gantt{grid-template-columns:var(--lws,210px) 5px minmax(0,1fr)}
  .r .c-w,.r .c-d,.r .c-s,.r .c-f,.r .c-p,.r .c-b,.r .c-v,.r .c-u{display:none}
  .r,.gl .r{grid-template-columns:30px minmax(0,1fr) 42px!important;min-width:0}
  .legend{display:none}
  .kpi .v{font-size:24px}
  .tabs button{padding:6px 10px}
  .top{gap:8px 10px}
  .brand{flex-basis:100%}
  .save span{display:none}
  .acts .btn{padding:6px 9px}
  .banner .long{display:none}
  #pTable thead{display:none}
  #pTable,#pTable tbody{display:block}
  #pTable tr{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  #pTable td{display:block;border:0;padding:0;min-width:0!important}
  #pTable td:first-child,#pTable td.qcell,#pTable td.ncell{grid-column:1/-1}
  #pTable td[data-l]::before{content:attr(data-l);display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-bottom:3px;font-family:var(--f-body)}
  #pTable td.n{text-align:left}
  #pTable .qin,#pTable .tin,#pTable .uin,#pTable .nin{width:100%;text-align:left}
  #pTable .qin{font-size:16px;padding:9px 10px}
  #pTable .nin{font-size:16px}
  .treq{align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">

<script>
/* ===== CORE: kalender, parser MSPDI, penjadwalan CPM, progres, ekspor ===== */
const DAY = 864e5;
const LINK_TYPES = ['FF', 'FS', 'SF', 'SS']; // indeks = kode Type MSPDI
const MONTHS = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

function isoToDn(s) { if (!s) return null; const [y, m, d] = s.slice(0, 10).split('-').map(Number); return Math.floor(Date.UTC(y, m - 1, d) / DAY); }
function dnToIso(dn) { return new Date(dn * DAY).toISOString().slice(0, 10); }

function fmtDn(dn, long) { if (dn == null) return '–'; const d = new Date(dn * DAY); const s = String(d.getUTCDate()).padStart(2, '0') + ' ' + MONTHS[d.getUTCMonth()]; return long === false ? s : s + ' ' + String(d.getUTCFullYear()).slice(2); }
function uid() { return Math.random().toString(36).slice(2, 10); }

/* Kalender kerja: indeks hari kerja <-> nomor hari */
class Cal {
  constructor(workdays, anchorDn) { this.wd = workdays && workdays.some(Boolean) ? workdays.slice() : [false, true, true, true, true, true, false]; this.base = anchorDn - 800; this.len = 0; this.build(4000); }
  build(len) {
    this.len = len; this.prefix = new Int32Array(len + 1); this.list = [];
    let c = 0; for (let i = 0; i < len; i++) { this.prefix[i] = c; if (this.wd[dnDow(this.base + i)]) { this.list.push(this.base + i); c++; } } this.prefix[len] = c;
  }
  ensureDn(dn) { while (dn - this.base >= this.len - 2) this.build(this.len * 2); if (dn < this.base) { const shift = this.base - dn + 400; this.base -= shift; this.build(this.len + shift); } }
  idx(dn) { this.ensureDn(dn); return this.prefix[dn - this.base]; } // hari libur -> hari kerja berikutnya
  dn(idx) { idx = Math.max(0, Math.floor(idx)); while (idx >= this.list.length - 1) this.build(this.len * 2); return this.list[idx]; }
  isWork(dn) { return this.wd[dnDow(dn)]; }
}

/* ---------- Parser XML MS Project (MSPDI) ---------- */
function kid(el, name) { if (!el) return null; for (let c = el.firstChild; c; c = c.nextSibling) if (c.nodeType === 1 && (c.localName || c.nodeName) === name) return c; return null; }

function parseIsoDur(s) { // jam
  if (!s) return 0; const m = /P(?:(\d+(?:\.\d+)?)D)?T?(?:(\d+(?:\.\d+)?)H)?(?:(\d+(?:\.\d+)?)M)?(?:(\d+(?:\.\d+)?)S)?/.exec(s); if (!m) return 0;
  return (+m[1] || 0) * 24 + (+m[2] || 0) + (+m[3] || 0) / 60 + (+m[4] || 0) / 3600;
}

function parseMSPDI(xmlText, DOMParserImpl) {

  const cals = kids(kid(root, 'Calendars'), 'Calendar'); const cal = cals.find(c => txt(c, 'UID') === calUid) || cals[0];
  if (cal) { const wds = kids(kid(cal, 'WeekDays'), 'WeekDay'); const w = workdays.slice(); let seen = false; wds.forEach(wd => { const t = +txt(wd, 'DayType'); if (t >= 1 && t <= 7) { w[t - 1] = txt(wd, 'DayWorking') === '1'; seen = true; } }); if (seen && w.some(Boolean)) workdays = w; }
  const tEls = kids(kid(root, 'Tasks'), 'Task'); const tasks = []; const importDn = Math.floor(Date.now() / DAY);
  for (const el of tEls) {
    const lvl = +txt(el, 'OutlineLevel'); const u = txt(el, 'UID'); if (u === '' || lvl === 0 || txt(el, 'IsNull') === '1') continue;
    const name = txt(el, 'Name') || '(tanpa nama)';
    const start = txt(el, 'Start').slice(0, 10), finish = txt(el, 'Finish').slice(0, 10);
    let dur = parseIsoDur(txt(el, 'Duration')) / hpd; dur = Math.round(dur * 100) / 100;
    const ms = txt(el, 'Milestone') === '1' || dur === 0;
    const preds = kids(el, 'PredecessorLink').map(pl => ({ u: txt(pl, 'PredecessorUID'), t: LINK_TYPES[+txt(pl, 'Type')] || 'FS', lag: Math.round((+txt(pl, 'LinkLag') || 0) / 10 / mpd * 100) / 100 })).filter(p => p.u !== '');
    const ct = +txt(el, 'ConstraintType'); const cd = txt(el, 'ConstraintDate').slice(0, 10);
    let snet = null; if ((ct === 2 || ct === 4) && cd) snet = cd; else if (!preds.length) snet = start || null;
    const bl = kids(el, 'Baseline').find(b => txt(b, 'Number') === '0' || txt(b, 'Number') === '');
    const t = { uid: u, name, lvl, dur: ms ? 0 : dur, ms, snet, preds, cost: (+txt(el, 'Cost') || 0) / 100, unit: '', qty: 0, w: 0,
      pct0: +txt(el, 'PercentComplete') || 0, pct0Dn: importDn, _start: start, _finish: finish,
      bs: bl ? txt(bl, 'Start').slice(0, 10) : null, bf: bl ? txt(bl, 'Finish').slice(0, 10) : null, bd: bl ? Math.round(parseIsoDur(txt(bl, 'Duration')) / hpd * 100) / 100 : null };
    if (!t.bs || !t.bf) { t.bs = t.bf = t.bd = null; }
    const vm = /Volume\s*:\s*([\d.,]+)\s*([^\s<]*)/i.exec(txt(el, 'Notes')); if (vm) { t.qty = parseFloat(vm[1].replace(/\.(?=\d{3}\b)/g, '').replace(',', '.')) || 0; t.unit = vm[2] || ''; }
    tasks.push(t);
  }

  const minLvl = Math.min(...tasks.map(t => t.lvl)); tasks.forEach(t => t.lvl = t.lvl - minLvl + 1);
  const pStart = (txt(root, 'StartDate') || '').slice(0, 10) || tasks.map(t => t._start).filter(Boolean).sort()[0];
  const proj = { name: txt(root, 'Title') || txt(root, 'Name').replace(/\.(xml|mpp)$/i, '') || 'Proyek', start: pStart, mpd, workdays, weightMode: tasks.some(t => t.cost > 0) ? 'cost' : 'dur' };
  return { proj, tasks };
}

/* ---------- Struktur outline + CPM ---------- */
function buildOutline(tasks) {
  const stack = []; const counters = [];
  tasks.forEach((t, i) => {
    if (t.lvl < 1) t.lvl = 1; if (i === 0) t.lvl = 1; else if (t.lvl > tasks[i - 1].lvl + 1) t.lvl = tasks[i - 1].lvl + 1;
    while (stack.length && stack[stack.length - 1].lvl >= t.lvl) stack.pop();
    t.parent = stack.length ? stack[stack.length - 1] : null; t.children = []; if (t.parent) t.parent.children.push(t);
    counters.length = t.lvl; counters[t.lvl - 1] = (counters[t.lvl - 1] || 0) + 1; t.wbs = counters.slice(0, t.lvl).join('.');
    t.id = i + 1; stack.push(t);
  });
  tasks.forEach(t => { t.sum = t.children.length > 0; });
}

function leavesOf(t, out = []) { if (!t.sum) out.push(t); else t.children.forEach(c => leavesOf(c, out)); return out; }

function schedule(proj, tasks) {
  buildOutline(tasks);
  const byUid = new Map(tasks.map(t => [t.uid, t]));
  const allStarts = tasks.map(t => t.snet || t._start).filter(Boolean).map(isoToDn);
  const pStartDn = isoToDn(proj.start) || (allStarts.length ? Math.min(...allStarts) : Math.floor(Date.now() / DAY));
  const cal = new Cal(proj.workdays, pStartDn);

  tasks.forEach(s => (s.preds || []).forEach(l => { const p = byUid.get(String(l.u)); if (p && p !== s) links.push({ p, s, t: l.t || 'FS', lag: +l.lag || 0 }); }));
  const linksTo = new Map(); links.forEach(L => { if (!linksTo.has(L.s)) linksTo.set(L.s, []); linksTo.get(L.s).push(L); });
  const dur = t => (t.ms ? 0 : Math.max(0, +t.dur || 0));
  leaves.forEach(t => { t.es = t.snet ? Math.max(cal.idx(isoToDn(t.snet)), P0) : P0; t.base = t.es; t.ef = t.es + dur(t); });
  const rollup = () => { for (let i = tasks.length - 1; i >= 0; i--) { const t = tasks[i]; if (t.sum) { t.es = Math.min(...t.children.map(c => c.es)); t.ef = Math.max(...t.children.map(c => c.ef)); } } };
  let iter = 0, changed = true; const maxIter = tasks.length + 10; let cycle = false;
  while (changed) {
    rollup(); changed = false; if (++iter > maxIter) { cycle = true; break; }
    for (const t of leaves) {
      let es = t.base; const d = dur(t);
      for (let a = t; a; a = a.parent) { const ls = linksTo.get(a); if (!ls) continue;
        for (const L of ls) { const p = L.p; let c; if (a !== t && (L.t === 'FF' || L.t === 'SF')) continue;
          if (L.t === 'FS') c = p.ef + L.lag; else if (L.t === 'SS') c = p.es + L.lag; else if (L.t === 'FF') c = p.ef + L.lag - d; else c = p.es + L.lag - d;
          if (c > es) es = c; } }
      if (Math.abs(es - t.es) > 1e-9) { t.es = es; t.ef = es + d; changed = true; }
    }
  }
  rollup();
  const pEF = Math.max(...leaves.map(t => t.ef), P0);
  // lintasan mundur
  leaves.forEach(t => { t.lf = pEF; t.ls = t.lf - dur(t); });
  const rollB = () => { for (let i = tasks.length - 1; i >= 0; i--) { const t = tasks[i]; if (t.sum) { t.ls = Math.min(...t.children.map(c => c.ls)); t.lf = Math.max(...t.children.map(c => c.lf)); } } };
  changed = true; iter = 0;
  while (changed && iter++ < maxIter) {
    rollB(); changed = false;
    for (const L of links) { const s = L.s; let lim;
      for (const p of leavesOf(L.p)) { const d = dur(p);
        if (L.t === 'FS') lim = s.ls - L.lag; else if (L.t === 'SS') lim = s.ls - L.lag + d; else if (L.t === 'FF') lim = s.lf - L.lag; else lim = s.lf - L.lag + d;
        if (lim < p.lf - 1e-9) { p.lf = lim; p.ls = lim - d; changed = true; } } }
  }
  rollB();
  leaves.forEach(t => { t.float = t.ls - t.es; t.crit = t.float <= 0.01; });
  for (let i = tasks.length - 1; i >= 0; i--) { const t = tasks[i]; if (t.sum) { t.crit = t.children.some(c => c.crit); t.float = Math.min(...t.children.map(c => c.float)); } }

    t.bsDn = isoToDn(t.bs); t.bfDn = isoToDn(t.bf);

}

/* ---------- Progres & EVM ---------- */
function weightOf(proj, t, totalCost) {

}
function plannedFrac(t, dn, cal) { // fraksi rencana baseline pada akhir hari dn

function entriesOf(prog, u) { const d = prog[u]; if (!d || !d.e) return []; return Object.entries(d.e).map(([id, e]) => ({ id, ...e })).sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0); }

function actualFrac(t, prog, dn) {

}
function computeProgress(proj, tasks, sched, prog, dn) {
  const leaves = tasks.filter(t => !t.sum); const totalCost = leaves.reduce((a, t) => a + (t.cost || 0), 0);

    if (!t.sum) { t.plan = plannedFrac(t, dn, sched.cal); t.act = actualFrac(t, prog, dn); t.wt = t._w; }
    else { t.wt = t.children.reduce((a, c) => a + c.wt, 0); t.plan = t.wt ? t.children.reduce((a, c) => a + c.plan * c.wt, 0) / t.wt : 0; t.act = t.wt ? t.children.reduce((a, c) => a + c.act * c.wt, 0) / t.wt : 0; }

}
function sCurve(proj, tasks, sched, prog, statusDn) {

  f = Math.max(f, statusDn); s = s - ((dnDow(s) + 6) % 7); // mulai Senin
  const pts = []; for (let d = s; ; d += 7) { const e = Math.min(d + 6, f);
    const plan = leaves.reduce((a, t) => a + plannedFrac(t, e, sched.cal) * t._w, 0) / W;
    const act = e <= statusDn ? leaves.reduce((a, t) => a + actualFrac(t, prog, e) * t._w, 0) / W : null;
    if (d <= statusDn && e > statusDn) { pts.push({ dn: statusDn, st: true, plan: leaves.reduce((a, t) => a + plannedFrac(t, statusDn, sched.cal) * t._w, 0) / W, act: leaves.reduce((a, t) => a + actualFrac(t, prog, statusDn) * t._w, 0) / W }); }

}

/* ---------- Ekspor MSPDI ---------- */
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function exportMSPDI(proj, tasks, sched, prog, statusDn) {
  const hpd = (proj.mpd || 480) / 60; const D = d => `PT${Math.round(d * hpd * 100) / 100}H0M0S`;
  if (statusDn != null) computeProgress(proj, tasks, sched, prog, statusDn);
  const out = [`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`, `<Project xmlns="http://schemas.microsoft.com/project">`,
    `<Name>${esc(proj.name)}.xml</Name><Title>${esc(proj.name)}</Title><ScheduleFromStart>1</ScheduleFromStart>`,
    `<StartDate>${dnToIso(sched.startDn)}T08:00:00</StartDate><FinishDate>${dnToIso(sched.finishDn)}T17:00:00</FinishDate>`,
    `<MinutesPerDay>${proj.mpd || 480}</MinutesPerDay><MinutesPerWeek>${(proj.mpd || 480) * proj.workdays.filter(Boolean).length}</MinutesPerWeek><DaysPerMonth>20</DaysPerMonth><CalendarUID>1</CalendarUID>`,
    `<Calendars><Calendar><UID>1</UID><Name>Standar</Name><IsBaseCalendar>1</IsBaseCalendar><WeekDays>`];
  proj.workdays.forEach((w, i) => out.push(`<WeekDay><DayType>${i + 1}</DayType><DayWorking>${w ? 1 : 0}</DayWorking>${w ? '<WorkingTimes><WorkingTime><FromTime>08:00:00</FromTime><ToTime>12:00:00</ToTime></WorkingTime><WorkingTime><FromTime>13:00:00</FromTime><ToTime>17:00:00</ToTime></WorkingTime></WorkingTimes>' : ''}</WeekDay>`));
  out.push(`</WeekDays></Calendar></Calendars><Tasks>`);
  out.push(`<Task><UID>0</UID><ID>0</ID><Name>${esc(proj.name)}</Name><OutlineLevel>0</OutlineLevel><Summary>1</Summary><Start>${dnToIso(sched.startDn)}T08:00:00</Start><Finish>${dnToIso(sched.finishDn)}T17:00:00</Finish></Task>`);
  const num = new Map(); let n = 1; tasks.forEach(t => { if (!/^\d+$/.test(t.uid)) { while (tasks.some(x => x.uid === String(n)) || [...num.values()].includes(String(n))) n++; num.set(t.uid, String(n++)); } });
  const U = u => num.get(u) || u;
  tasks.forEach(t => {
    const pct = Math.round((t.act || 0) * 100);
    out.push(`<Task><UID>${U(t.uid)}</UID><ID>${t.id}</ID><Name>${esc(t.name)}</Name><WBS>${t.wbs}</WBS><OutlineNumber>${t.wbs}</OutlineNumber><OutlineLevel>${t.lvl}</OutlineLevel>` +
      `<Start>${dnToIso(t.startDn)}T08:00:00</Start><Finish>${dnToIso(t.finishDn)}T17:00:00</Finish><Duration>${D(t.sum ? t.calDur : (t.ms ? 0 : t.dur))}</Duration><DurationFormat>7</DurationFormat>` +
      `<Manual>0</Manual><Summary>${t.sum ? 1 : 0}</Summary><Milestone>${t.ms ? 1 : 0}</Milestone><Critical>${t.crit ? 1 : 0}</Critical><PercentComplete>${pct}</PercentComplete>` +
      (t.cost ? `<Cost>${Math.round(t.cost * 100)}</Cost>` : '') +
      (!t.sum && t.snet ? `<ConstraintType>4</ConstraintType><ConstraintDate>${t.snet}T08:00:00</ConstraintDate>` : '<ConstraintType>0</ConstraintType>') +
      (!t.sum && t.unit ? `<Notes>${esc('Volume: ' + t.qty + ' ' + t.unit)}</Notes>` : '') +
      (t.preds || []).map(l => `<PredecessorLink><PredecessorUID>${U(String(l.u))}</PredecessorUID><Type>${Math.max(0, LINK_TYPES.indexOf(l.t))}</Type><CrossProject>0</CrossProject><LinkLag>${Math.round((+l.lag || 0) * (proj.mpd || 480) * 10)}</LinkLag><LagFormat>7</LagFormat></PredecessorLink>`).join('') +
      (t.bs ? `<Baseline><Number>0</Number><Start>${t.bs}T08:00:00</Start><Finish>${t.bf}T17:00:00</Finish><Duration>${D(t.bd || 0)}</Duration></Baseline>` : '') + `</Task>`);
  });
  out.push(`</Tasks></Project>`); return out.join('\n');
}

/* ---------- Teks predecessor ---------- */
function predsToText(t, byUid) { return (t.preds || []).map(l => { const p = byUid.get(String(l.u)); if (!p) return ''; const lag = +l.lag || 0; return p.id + (l.t !== 'FS' || lag ? l.t : '') + (lag ? (lag > 0 ? '+' : '') + lag + 'h' : ''); }).filter(Boolean).join(', '); }
function textToPreds(s, tasks) {
  const out = []; const errs = [];
  String(s || '').split(/[,;]/).map(x => x.trim()).filter(Boolean).forEach(tok => {
    const m = /^(\d+)\s*(FS|SS|FF|SF)?\s*([+-]\s*\d+(?:[.,]\d+)?)?\s*(h|hari|d)?$/i.exec(tok);
    if (!m) { errs.push(tok); return; } const t = tasks[+m[1] - 1]; if (!t) { errs.push(tok); return; }
    out.push({ u: t.uid, t: (m[2] || 'FS').toUpperCase(), lag: m[3] ? +m[3].replace(/\s/g, '').replace(',', '.') : 0 });
  });

async function doImport(file) {

function csvCell(v) { const s = String(v == null ? '' : v); return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
async function doExport(kind) {

    ST.tasks.filter(t => !t.sum).forEach(t => entriesOf(ST.prog, t.uid).forEach(e => rows.push([e.d, e.p === 'W' ? 'Mingguan' : 'Harian', t.wbs, t.name, e.q, t.unit, e.n || ''])));
    rows.sort((a, b) => a[0] < b[0] ? -1 : 1); name = safe + '_progres.csv'; data = '﻿' + rows.map(r => r.map(csvCell).join(';')).join('\n');

    const rows = [['WBS', 'Aktivitas', 'Durasi (hari)', 'Mulai', 'Selesai', 'Baseline mulai', 'Baseline selesai', 'Bobot %', 'Volume target', 'Satuan', 'Volume realisasi', 'Rencana %', 'Realisasi %', 'Deviasi %', 'Kritis']];
    ST.tasks.forEach(t => rows.push([t.wbs, t.name, t.calDur, dnToIso(t.startDn), dnToIso(t.finishDn), t.bs || '', t.bf || '', (t.bobot || 0).toFixed(3).replace('.', ','), t.sum ? '' : t.qty, t.sum ? '' : t.unit, t.sum ? '' : actualQty(ST.prog, t.uid, ST.statusDn), (t.plan * 100).toFixed(2).replace('.', ','), (t.act * 100).toFixed(2).replace('.', ','), ((t.act - t.plan) * 100).toFixed(2).replace('.', ','), t.crit ? 'Ya' : '']));
    name = safe + '_kemajuan_' + dnToIso(ST.statusDn) + '.csv'; data = '﻿' + rows.map(r => r.map(csvCell).join(';')).join('\n');

  setTimeout(() => modal(name, `<textarea class="inp" style="height:280px;font-family:var(--f-mono);font-size:11px" readonly>${H(data)}</textarea>`, [{ label: 'Salin', cls: 'pri', fn: mb => { const ta = $('textarea', mb); navigator.clipboard.writeText(ta.value).then(() => toast('Disalin.'), () => { ta.select(); toast('Tekan Ctrl+C untuk menyalin.'); }); return false; } }, { label: 'Tutup' }]), 50);
}

function pushUndo() { ST.undo.push(JSON.stringify({ proj: ST.proj, tasks: cleanTasks() })); if (ST.undo.length > 40) ST.undo.shift(); }
function commit() { if (ST.proj.sample) { /* tetap contoh */ } recalc(); queueSave(); render(); }
function undo() { const s = ST.undo.pop(); if (!s) return; const o = JSON.parse(s); ST.proj = o.proj; ST.tasks = o.tasks; commit(); toast('Perubahan terakhir dibatalkan.'); }
function setBaseline(onlySel) {

  list.forEach(t => { if (!t) return; t.bs = dnToIso(t.startDn); t.bf = dnToIso(t.finishDn); t.bd = t.sum ? null : (t.ms ? 0 : t.dur); });
  if (!onlySel) list.forEach(t => { t.pct0Dn = t.pct0Dn || TODAY; });
}
function selIndex() { return ST.tasks.findIndex(t => t.uid === ST.sel); }
function newUid() { let m = 0; ST.tasks.forEach(t => { const n = parseInt(t.uid, 10); if (!isNaN(n) && n > m) m = n; }); return String(m + 1); }
function addTask(asChild) {

  let at = ST.tasks.length, lvl = 1;
  if (ref) { if (asChild) { at = i + 1; lvl = ref.lvl + 1; } else { let j = i + 1; while (j < ST.tasks.length && ST.tasks[j].lvl > ref.lvl) j++; at = j; lvl = ref.lvl; } }
  const t = { uid: newUid(), name: 'Aktivitas baru', lvl, dur: 5, ms: false, snet: ref ? dnToIso(ref.startDn) : ST.proj.start, preds: [], unit: '', qty: 0, cost: 0, w: 0, pct0: 0, bs: null, bf: null, bd: null };
  ST.tasks.splice(at, 0, t); ST.sel = t.uid; commit(); setTimeout(() => { const n = $('#fName'); n && (n.focus(), n.select()); }, 30);

async function saveProg() {

  const rows = $$('#pTable tbody tr'); let schedChanged = false; const adds = []; const errs = [];
  rows.forEach(r => { const t = ST.byUid.get(r.dataset.uid); const g = f => { const el = $(`[data-f="${f}"]`, r); return el ? el.value.trim() : null; };
    if (admin) { const unit = g('unit'), qty = parseFloat(g('qty')) || 0; if (unit !== (t.unit || '') || qty !== (+t.qty || 0)) { if (!schedChanged) pushUndo(); t.unit = unit; t.qty = qty; schedChanged = true; } }
    const q = parseFloat((g('q') || '').replace(',', '.')); if (!isNaN(q) && q !== 0) { if (!t.qty) { errs.push(t.name); return; } adds.push({ t, q, n: g('n') || '' }); } });

  if (!adds.length && !schedChanged) { $('#pMsg').textContent = 'Belum ada volume yang diisi.'; return; }
  if (schedChanged) { recalc(); queueSave(); }
  const over = []; $('#pSave').disabled = true; let ok = 0;
  try { for (const a of adds) { const cur = actualQty(ST.prog, a.t.uid, null); if (cur + a.q > a.t.qty * 1.0001) over.push(a.t.name); const e = { d: ST.pgDate, p: ST.pgPer, q: a.q, n: a.n }; if (ST.me) e.by = ST.me; await writeProg(a.t.uid, { [uid()]: e }); ok++; } }
  catch (e) { handleDbErr(e); }
  recalc(); renderProg();
  if (ok || schedChanged) toast(ok ? `${ok} entri progres disimpan untuk ${fmtDn(isoToDn(ST.pgDate))}.` : 'Volume target diperbarui.');
  if (over.length) setTimeout(() => toast('Kumulatif melebihi volume target: ' + over.join(', ') + '. Periksa target atau entri.'), 1200);
}

function rp(v) { const a = Math.abs(v); const s = v < 0 ? '−' : ''; if (a >= 1e9) return s + 'Rp ' + nf(a / 1e9, 2) + ' M'; if (a >= 1e6) return s + 'Rp ' + nf(a / 1e6, 1) + ' jt'; return s + 'Rp ' + nf(a, 0); }

function weekData(w) {
  const E = Math.min(w.e, Math.max(TODAY, w.a)); const P = w.a - 1;

  const rows = new Map();
  for (let i = ST.tasks.length - 1; i >= 0; i--) {
    const t = ST.tasks[i]; let r;
    if (!t.sum) {
      const w_ = t._w / W;
      r = { w: w_, pP: plannedFrac(t, P, cal) * w_, pN: plannedFrac(t, E, cal) * w_, aP: actualFrac(t, ST.prog, P) * w_, aN: actualFrac(t, ST.prog, E) * w_,
        qP: actualQty(ST.prog, t.uid, P), qN: actualQty(ST.prog, t.uid, E) };
    } else {
      r = { w: 0, pP: 0, pN: 0, aP: 0, aN: 0 }; t.children.forEach(c => { const x = rows.get(c.uid); ['w', 'pP', 'pN', 'aP', 'aN'].forEach(k => r[k] += x[k]); });
    }
    rows.set(t.uid, r);
  }
  const tot = { w: 0, pP: 0, pN: 0, aP: 0, aN: 0 }; ST.tasks.filter(t => !t.sum).forEach(t => { const x = rows.get(t.uid); ['w', 'pP', 'pN', 'aP', 'aN'].forEach(k => tot[k] += x[k]); });
  const pts = sCurve(ST.proj, ST.tasks, ST.sched, ST.prog, E);
  computeProgress(ST.proj, ST.tasks, ST.sched, ST.prog, E);

  notes.sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0);

}

  table(rc, groups.map(g => { const r = D.rows.get(g.uid); const d = r.aN - r.pN; return { cells: [g.wbs, g.name, nf(r.w * 100, 2), nf(r.pP * 100, 2), nf((r.pN - r.pP) * 100, 2), nf(r.pN * 100, 2), nf(r.aP * 100, 2), nf((r.aN - r.aP) * 100, 2), nf(r.aN * 100, 2), sgn(d)], colors: { 9: devColor(d) } }; }),
    { group: [{ label: 'RENCANA (%)', from: 3, to: 5 }, { label: 'REALISASI (%)', from: 6, to: 8 }], total: ['', 'Total proyek', '100,00', nf(t.pP * 100, 2), nf((t.pN - t.pP) * 100, 2), nf(t.pN * 100, 2), nf(t.aP * 100, 2), nf((t.aN - t.aP) * 100, 2), nf(t.aN * 100, 2), sgn(dev)] });

  // Rincian item
  if (opt.detail) {
    newPage();
    section('Rincian volume per item pekerjaan', `realisasi minggu ke-${w.n} dan kumulatif`);
    const dc = [{ h: 'WBS', w: 34, mono: true }, { h: 'Uraian pekerjaan', wrap: true }, { h: 'Sat', w: 26 }, { h: 'Target', w: 44, align: 'right', mono: true },
      { h: 'Mgg ini', w: 42, align: 'right', mono: true }, { h: 's.d. ini', w: 44, align: 'right', mono: true }, { h: 'Bobot %', w: 36, align: 'right', mono: true },
      { h: 'Rencana', w: 38, align: 'right', mono: true }, { h: 'Realisasi', w: 40, align: 'right', mono: true }, { h: 'Dev', w: 36, align: 'right', mono: true }];
    const fq = v => v ? nf(v, v % 1 ? 2 : 0) : '–';
    table(dc, ST.tasks.map(tk => { const r = D.rows.get(tk.uid); const d = r.aN - r.pN; const ind = (tk.lvl - 1) * 7;
      if (tk.sum) return { bold: true, fill: tk.lvl === 1 ? RC.fill : null, indent: ind, cells: [tk.wbs, tk.name, '', '', '', '', nf(r.w * 100, 2), nf(r.pN * 100, 2), nf(r.aN * 100, 2), sgn(d)], colors: { 9: devColor(d) } };
      const pr = r.w ? r.pN / r.w : 0, ar = r.w ? r.aN / r.w : 0;
      return { indent: ind, cells: [tk.wbs, tk.name, tk.unit || '', fq(tk.qty), fq(r.qN - r.qP), fq(r.qN), nf(r.w * 100, 2), pct(pr, 0) + '%', pct(ar, 0) + '%', (ar - pr >= 0 ? '+' : '') + nf((ar - pr) * 100, 0)], colors: { 4: r.qN - r.qP > 0 ? RC.accent : RC.faint, 9: devColor(ar - pr) } }; }),
      { group: [{ label: 'VOLUME', from: 3, to: 5 }, { label: 'S.D. MINGGU INI', from: 7, to: 9 }] });
    pg.text(PM, y, 'Rencana, Realisasi, Dev pada baris item = % dari volume item itu sendiri; pada baris kelompok = % terhadap total proyek.', { size: 6.5, color: RC.muted }); y += 16;
  }
  // Item tertinggal
  const late = leaves.map(tk => { const r = D.rows.get(tk.uid); return { tk, r, gap: r.pN - r.aN }; }).filter(x => x.gap > 0.0005 && x.r.w > 0 && (x.r.pN - x.r.aN) / x.r.w > 0.05).sort((a, b) => b.gap - a.gap).slice(0, 10);
  section('Item tertinggal dari rencana', 'selisih > 5% volume item, diurutkan menurut dampak ke total proyek');
  if (late.length) table([{ h: 'WBS', w: 34, mono: true }, { h: 'Item pekerjaan', wrap: true }, { h: 'Kelompok', w: 120, wrap: true }, { h: 'Rencana', w: 44, align: 'right', mono: true }, { h: 'Realisasi', w: 44, align: 'right', mono: true }, { h: 'Dampak', w: 46, align: 'right', mono: true }, { h: 'Float', w: 44, align: 'right' }],
    late.map(({ tk, r, gap }) => ({ cells: [tk.wbs, tk.name, tk.parent ? tk.parent.name : '', pct(r.pN / r.w, 0) + '%', pct(r.aN / r.w, 0) + '%', '−' + nf(gap * 100, 2) + ' pp', tk.crit ? 'Kritis' : nf(tk.float, 0) + ' hr'], colors: { 5: RC.bad, 6: tk.crit ? RC.bad : RC.muted } })));
  else { pg.text(PM, y + 4, 'Tidak ada item yang tertinggal lebih dari 5% dari rencananya.', { size: 8, color: RC.muted }); y += 18; }
  // Catatan lapangan
  if (opt.notes) {
    section('Catatan lapangan', `entri progres ${fmtDn(w.a, false)} – ${fmtDn(D.E)}`);
    const ns = D.notes; if (ns.length) table([{ h: 'Tanggal', w: 46, mono: true }, { h: 'Item pekerjaan', wrap: true }, { h: 'Volume', w: 58, align: 'right', mono: true }, { h: 'Pelaksana', w: 86, wrap: true }, { h: 'Catatan', w: 150, wrap: true }],
      ns.map(e => ({ cells: [fmtDn(isoToDn(e.d)), e.t.name, '+' + nf(e.q, e.q % 1 ? 2 : 0) + ' ' + (e.t.unit || ''), (e.by && byLabel(e.by)) || '–', (e.p === 'W' ? '[Mingguan] ' : '') + (e.n || '')] })));
    else { pg.text(PM, y + 4, 'Belum ada entri progres pada minggu ini.', { size: 8, color: RC.muted }); y += 18; }
  }
  // Tanda tangan
  if (opt.sign) {
    ensure(110); y += 6; const bw = (PDF_W - 2 * PM - 2 * 14) / 3;
    [['Dibuat oleh', opt.role || 'Kepala Lapangan', opt.by], ['Diperiksa oleh', 'Site Manager / Konsultan MK', ''], ['Disetujui oleh', 'Pemilik Proyek / PPK', '']].forEach((s, i) => {
      const x = PM + i * (bw + 14); pg.text(x, y + 8, s[0] + ',', { size: 8, color: RC.muted }); pg.text(x, y + 19, s[1], { size: 8, weight: 600 });
      pg.line(x, y + 78, x + bw, y + 78, RC.ink, 0.6); pg.text(x, y + 89, s[2] || 'Nama & tanggal', { size: 7.5, color: s[2] ? RC.ink : RC.faint, weight: s[2] ? 600 : 400 }); });
    y += 100;
  }
  // Footer + nomor halaman
  const stamp = new Date(); const ts = `${fmtLong(TODAY)} ${String(stamp.getHours()).padStart(2, '0')}:${String(stamp.getMinutes()).padStart(2, '0')}`;
  pages.forEach((p, i) => { p.line(PM, PDF_H - 30, PDF_W - PM, PDF_H - 30, RC.line); p.text(PM, PDF_H - 19, `Kendali Jadwal Proyek · dibuat ${ts}`, { size: 6.8, color: RC.faint }); p.text(PDF_W - PM, PDF_H - 19, `Halaman ${i + 1} dari ${pages.length}`, { size: 6.8, color: RC.faint, align: 'right' }); });
  // JPEG -> PDF
  const jpgs = []; for (const p of pages) jpgs.push(await canvasJpeg(p.c));
  const blob = buildPdf(jpgs, pages[0].c.width, pages[0].c.height, `Laporan Mingguan ${w.n} - ${proj.name}`);
  const safe = proj.name.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_') || 'proyek';
  await saveBlob(blob, `Laporan_Mingguan_${String(w.n).padStart(2, '0')}_${safe}.pdf`);
  ST.lastPdf = pages; // untuk pratinjau/uji
}
function canvasJpeg(c) { return new Promise((res, rej) => c.toBlob(b => b ? b.arrayBuffer().then(a => res(new Uint8Array(a)), rej) : rej(new Error('Kanvas tidak bisa diekspor')), 'image/jpeg', 0.9)); }
function buildPdf(jpgs, iw, ih, title) {
  const enc = new TextEncoder(); const parts = []; const offs = []; let len = 0;
  const push = x => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); len += b.length; };
  const obj = (id, f) => { offs[id] = len; push(id + ' 0 obj\n'); f(); push('\nendobj\n'); };
  push('%PDF-1.4\n'); push(new Uint8Array([37, 226, 227, 207, 211, 10]));
  const n = jpgs.length, infoId = 3 + 3 * n; const W = PDF_W.toFixed(2), Hh = PDF_H.toFixed(2);
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push(`<< /Type /Pages /Kids [${jpgs.map((_, i) => (3 + 3 * i) + ' 0 R').join(' ')}] /Count ${n} >>`));
  jpgs.forEach((j, i) => {
    const p = 3 + 3 * i, c = p + 1, im = p + 2; const s = `q ${W} 0 0 ${Hh} 0 0 cm /Im${i} Do Q`;
    obj(p, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${Hh}] /Resources << /XObject << /Im${i} ${im} 0 R >> >> /Contents ${c} 0 R >>`));
    obj(c, () => { push(`<< /Length ${s.length} >>\nstream\n`); push(s); push('\nendstream'); });
    obj(im, () => { push(`<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.length} >>\nstream\n`); push(j); push('\nendstream'); });
  });
  const ascii = String(title).normalize('NFKD').replace(/[^\x20-\x7e]/g, '').replace(/([()\\])/g, '\\$1');
  obj(infoId, () => push(`<< /Title (${ascii}) /Producer (Kendali Jadwal Proyek) >>`));
  const xref = len; push(`xref\n0 ${infoId + 1}\n0000000000 65535 f \n`);
  for (let i = 1; i <= infoId; i++) push(String(offs[i]).padStart(10, '0') + ' 00000 n \n');
  push(`trailer\n<< /Size ${infoId + 1} /Root 1 0 R /Info ${infoId} 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, { type: 'application/pdf' });
}
async function saveBlob(blob, name) {
  if (dl) { try { await dl.save({ filename: name, data: blob }); toast('PDF disimpan: ' + name); return; } catch (e) { if (e && e.code === 'declined') return; console.error(e); if (window.claude) throw new Error('Unduhan ditolak oleh tampilan ini (' + (e.code || 'galat') + ').'); } }
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); toast('PDF diunduh: ' + name);
}
